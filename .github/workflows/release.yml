name: Build release artifacts

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Existing canonical SemVer tag to build
        required: true
        type: string
      publish_release:
        description: Publish the completed artifacts to GitHub Releases
        required: true
        type: boolean
        default: false
      draft:
        description: Create a draft release when publishing a new tag
        required: true
        type: boolean
        default: true

permissions:
  actions: read
  attestations: write
  contents: read
  id-token: write
  security-events: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event_name == 'release' && github.event.release.tag_name || github.ref_name }}

jobs:
  metadata:
    name: Release metadata
    runs-on: ubuntu-latest
    outputs:
      build_time: ${{ steps.metadata.outputs.build_time }}
      commit: ${{ steps.metadata.outputs.commit }}
      source_date_epoch: ${{ steps.metadata.outputs.source_date_epoch }}
      tag: ${{ steps.metadata.outputs.tag }}
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - name: Resolve source identity
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          commit="$(git rev-parse HEAD)"
          test "$commit" = "$(git rev-list -n 1 "$tag")"
          test -z "$(git status --porcelain)"
          source_date_epoch="$(git show -s --format=%ct "$commit")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "source_date_epoch=$source_date_epoch" >> "$GITHUB_OUTPUT"
          echo "build_time=$(date -u -d "@$source_date_epoch" +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

  required-checks:
    name: Required checks
    needs: metadata
    uses: ./.github/workflows/test.yml
    with:
      ref: ${{ needs.metadata.outputs.commit }}
    permissions:
      actions: read
      contents: read
      security-events: write

  geo:
    name: Current upstream geo assets
    needs: metadata
    runs-on: ubuntu-latest
    steps:
      - name: Download and verify current upstream assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p geo-assets
          assets=(
            "geoip geoip geoip"
            "domain-list-community dlc geosite"
          )
          for asset in "${assets[@]}"; do
            read -r repository upstream_name output_name <<< "$asset"
            url="https://raw.githubusercontent.com/v2fly/$repository/release/$upstream_name.dat"
            curl --fail --location --retry 3 "$url" --output "geo-assets/$output_name.dat"
            expected="$(curl --fail --location --retry 3 "$url.sha256sum" | awk '{print $1}')"
            actual="$(sha256sum "geo-assets/$output_name.dat" | awk '{print $1}')"
            [[ "$expected" =~ ^[0-9a-fA-F]{64}$ ]]
            test "$actual" = "${expected,,}"
          done
      - name: Upload geo assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: geo-assets
          path: geo-assets
          if-no-files-found: error
          retention-days: 14

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}${{ matrix.goarm }}
    needs: [metadata, required-checks, geo]
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        goos: [windows, freebsd, openbsd, linux, darwin]
        goarch: [amd64, "386"]
        exclude:
          - goarch: "386"
            goos: darwin
          - goarch: "386"
            goos: openbsd
        include:
          - goos: darwin
            goarch: arm64
          - goos: linux
            goarch: arm
            goarm: "7"
          - goos: linux
            goarch: arm
            goarm: "6"
          - goos: linux
            goarch: arm
            goarm: "5"
          - goos: android
            goarch: arm64
          - goos: linux
            goarch: arm64
          - goos: linux
            goarch: riscv64
          - goos: linux
            goarch: mips64
          - goos: linux
            goarch: mips64le
          - goos: linux
            goarch: mipsle
          - goos: linux
            goarch: mips
          - goos: linux
            goarch: ppc64le
          - goos: freebsd
            goarch: arm64
          - goos: freebsd
            goarch: arm
            goarm: "7"
          - goos: linux
            goarch: s390x
    env:
      CGO_ENABLED: "0"
      GOARCH: ${{ matrix.goarch }}
      GOARM: ${{ matrix.goarm }}
      GOOS: ${{ matrix.goos }}
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.metadata.outputs.tag }}
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Download geo assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: geo-assets
          path: geo-assets
      - name: Resolve asset name
        id: asset
        shell: bash
        run: |
          set -euo pipefail
          key="$GOOS-$GOARCH${GOARM:-}"
          asset_name="$(jq -r --arg key "$key" '.[$key].friendlyName // empty' .github/build/friendly-filenames.json)"
          test -n "$asset_name"
          echo "name=$asset_name" >> "$GITHUB_OUTPUT"
      - name: Build full binary
        shell: bash
        env:
          BUILD_TIME: ${{ needs.metadata.outputs.build_time }}
          COMMIT: ${{ needs.metadata.outputs.commit }}
          TAG: ${{ needs.metadata.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p build_assets
          ldflags="-s -w -buildid= \
            -X github.com/Mtoly/XrayRP/internal/buildinfo.BuildTag=$TAG \
            -X github.com/Mtoly/XrayRP/internal/buildinfo.BuildCommit=$COMMIT \
            -X github.com/Mtoly/XrayRP/internal/buildinfo.BuildTime=$BUILD_TIME \
            -X github.com/Mtoly/XrayRP/internal/buildinfo.BuildDirty=false"
          go build -v -o build_assets/XrayR -tags with_quic -trimpath -ldflags "$ldflags" .
          if [[ "$GOARCH" == "mips" || "$GOARCH" == "mipsle" ]]; then
            GOMIPS=softfloat go build -v -o build_assets/XrayR_softfloat \
              -tags with_quic -trimpath -ldflags "$ldflags" .
          fi
          if [[ "$GOOS" == "windows" ]]; then
            mv build_assets/XrayR build_assets/XrayR.exe
          fi
      - name: Add release files and digest map
        shell: bash
        env:
          ASSET_NAME: ${{ steps.asset.outputs.name }}
          BUILD_TIME: ${{ needs.metadata.outputs.build_time }}
          COMMIT: ${{ needs.metadata.outputs.commit }}
          SOURCE_DATE_EPOCH: ${{ needs.metadata.outputs.source_date_epoch }}
          TAG: ${{ needs.metadata.outputs.tag }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          cp README.md LICENSE build_assets/
          cp release/config/dns.json build_assets/
          cp release/config/route.json build_assets/
          cp release/config/custom_outbound.json build_assets/
          cp release/config/custom_inbound.json build_assets/
          cp release/config/rulelist build_assets/
          cp release/config/config.yml.example build_assets/config.yml
          cp geo-assets/geoip.dat geo-assets/geosite.dat build_assets/
          jq -n \
            --arg version "$VERSION" \
            --arg tag "$TAG" \
            --arg source_commit "$COMMIT" \
            --arg build_time "$BUILD_TIME" \
            --arg goos "$GOOS" \
            --arg goarch "$GOARCH" \
            --arg goarm "${GOARM:-}" \
            '{
              schema: 1,
              version: $version,
              tag: $tag,
              source_commit: $source_commit,
              build_time: $build_time,
              dirty: false,
              goos: $goos,
              goarch: $goarch,
              goarm: $goarm
            }' > build_assets/BUILD_INFO.json

          binary_records="$(mktemp)"
          for binary in XrayR XrayR.exe XrayR_softfloat; do
            binary_path="build_assets/$binary"
            if [[ ! -f "$binary_path" ]]; then
              continue
            fi
            jq -nc \
              --arg asset "$ASSET_NAME" \
              --arg name "$binary" \
              --arg source_commit "$COMMIT" \
              --arg sha256 "$(sha256sum "$binary_path" | awk '{print $1}')" \
              --arg sha512 "$(sha512sum "$binary_path" | awk '{print $1}')" \
              '{
                asset: $asset,
                name: $name,
                source_commit: $source_commit,
                sha256: $sha256,
                sha512: $sha512
              }' >> "$binary_records"
          done
          test -s "$binary_records"
          jq -s \
            --arg version "$VERSION" \
            --arg tag "$TAG" \
            --arg source_commit "$COMMIT" \
            '{
              schema: 1,
              version: $version,
              tag: $tag,
              source_commit: $source_commit,
              binaries: sort_by(.name)
            }' "$binary_records" > build_assets/BINARY_DIGESTS.json
          rm -f "$binary_records"
          find build_assets -exec touch -d "@$SOURCE_DATE_EPOCH" {} +
      - name: Create archive
        id: package
        shell: bash
        env:
          ASSET_NAME: ${{ steps.asset.outputs.name }}
        run: |
          set -euo pipefail
          archive="XrayR-$ASSET_NAME.zip"
          (cd build_assets && zip -X -9 -r "../$archive" .)
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "asset_name=$ASSET_NAME" >> "$GITHUB_OUTPUT"
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: build_assets
          format: spdx-json
          syft-version: v1.50.0
          output-file: ${{ steps.package.outputs.asset_name }}.spdx.json
          upload-artifact: false
      - name: Create checksums and asset manifest
        shell: bash
        env:
          ARCHIVE: ${{ steps.package.outputs.archive }}
          ASSET_NAME: ${{ steps.package.outputs.asset_name }}
          BUILD_TIME: ${{ needs.metadata.outputs.build_time }}
          COMMIT: ${{ needs.metadata.outputs.commit }}
          TAG: ${{ needs.metadata.outputs.tag }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"
          sha512sum "$ARCHIVE" > "$ARCHIVE.sha512"
          jq -n \
            --arg name "$ARCHIVE" \
            --arg version "$VERSION" \
            --arg tag "$TAG" \
            --arg source_commit "$COMMIT" \
            --arg build_time "$BUILD_TIME" \
            --arg goos "$GOOS" \
            --arg goarch "$GOARCH" \
            --arg goarm "${GOARM:-}" \
            --arg sha256 "$(awk '{print $1}' "$ARCHIVE.sha256")" \
            --arg sha512 "$(awk '{print $1}' "$ARCHIVE.sha512")" \
            --arg sbom "$ASSET_NAME.spdx.json" \
            --arg signature "$ARCHIVE.sigstore.json" \
            --argjson binaries "$(jq -c '.binaries' build_assets/BINARY_DIGESTS.json)" \
            '{
              name: $name,
              version: $version,
              tag: $tag,
              source_commit: $source_commit,
              build_time: $build_time,
              dirty: false,
              goos: $goos,
              goarch: $goarch,
              goarm: $goarm,
              sha256: $sha256,
              sha512: $sha512,
              sbom: $sbom,
              signature_bundle: $signature,
              binaries: $binaries
            }' > "$ASSET_NAME.build.json"
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign archive
        shell: bash
        env:
          ARCHIVE: ${{ steps.package.outputs.archive }}
        run: cosign sign-blob --yes --bundle "$ARCHIVE.sigstore.json" "$ARCHIVE"
      - name: Attest archive provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: ${{ steps.package.outputs.archive }}
      - name: Upload release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ steps.package.outputs.asset_name }}
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.archive }}.sha256
            ${{ steps.package.outputs.archive }}.sha512
            ${{ steps.package.outputs.archive }}.sigstore.json
            ${{ steps.package.outputs.asset_name }}.build.json
            ${{ steps.package.outputs.asset_name }}.spdx.json
          if-no-files-found: error
          retention-days: 14

  release-bundle:
    name: Assemble release manifest
    needs: [metadata, required-checks, build]
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Create release manifest and checksums
        shell: bash
        env:
          BUILD_TIME: ${{ needs.metadata.outputs.build_time }}
          COMMIT: ${{ needs.metadata.outputs.commit }}
          TAG: ${{ needs.metadata.outputs.tag }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          jq -s \
            --arg version "$VERSION" \
            --arg tag "$TAG" \
            --arg source_commit "$COMMIT" \
            --arg build_time "$BUILD_TIME" \
            '{
              schema: 1,
              version: $version,
              tag: $tag,
              source_commit: $source_commit,
              build_time: $build_time,
              dirty: false,
              assets: sort_by(.name),
              binaries: ([.[].binaries[]] | sort_by(.asset, .name)),
              sboms: ([.[] | {asset: .name, sbom: .sbom, source_commit: .source_commit}] | sort_by(.asset))
            }' dist/*.build.json > dist/release-manifest.json
          (
            cd dist
            shopt -s nullglob
            archives=(XrayR-*.zip)
            ((${#archives[@]} > 0))
            sha256sum "${archives[@]}" > SHA256SUMS
          )
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign release metadata
        run: |
          cosign sign-blob --yes --bundle dist/SHA256SUMS.sigstore.json dist/SHA256SUMS
          cosign sign-blob --yes --bundle dist/release-manifest.sigstore.json dist/release-manifest.json
      - name: Attest release manifest provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: dist/release-manifest.json
      - name: Upload release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-bundle
          path: dist
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: Publish GitHub release
    needs: [metadata, required-checks, release-bundle]
    if: ${{ github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.publish_release) }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - name: Download release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-bundle
          path: dist
      - name: Create or update release
        shell: bash
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.metadata.outputs.tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=(dist/XrayR-*.zip)
          ((${#archives[@]} > 0))
          release_assets=("${archives[@]}" dist/SHA256SUMS dist/SHA256SUMS.sigstore.json)
          for asset in "${release_assets[@]}"; do
            test -s "$asset"
          done
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${release_assets[@]}" --clobber
          elif [[ "${{ inputs.draft }}" == "true" ]]; then
            gh release create "$TAG" "${release_assets[@]}" --verify-tag --title "$TAG" --generate-notes --draft
          else
            gh release create "$TAG" "${release_assets[@]}" --verify-tag --title "$TAG" --generate-notes
          fi
