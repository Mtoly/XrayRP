name: Docker validation

# Builds the Dockerfile on pull requests so a base-image or Dockerfile change is
# actually built before merge. The release publishing workflow (docker.yml) is
# untouched and remains the only path that publishes images.
on:
  pull_request:
    branches:
      - master
    paths:
      - Dockerfile
      - .github/workflows/docker*.yml

permissions:
  contents: read

jobs:
  docker:
    name: Build and smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image for the current platform
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: xrayrp:pr-validation
      - name: Smoke test the built image
        run: docker run --rm xrayrp:pr-validation version
